
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Task - TaskFlow</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <main class="main-content">
        <section class="form-card">
            <h1>Edit Task</h1>
            <p>Update your task details below.</p>

            <form action="/update-task/{{ task.id }}" method="post">
                <label for="title">Task title</label>
                <input
                    type="text"
                    id="title"
                    name="title"
                    value="{{ task.title }}"
                    required
                >

                <label for="description">Description</label>
                <textarea
                    id="description"
                    name="description"
                    rows="4"
                >{{ task.description or '' }}</textarea>

                <label for="priority">Priority</label>
                <select id="priority" name="priority">
                    <option value="low" {% if task.priority == 'low' %}selected{% endif %}>Low</option>
                    <option value="medium" {% if task.priority == 'medium' %}selected{% endif %}>Medium</option>
                    <option value="high" {% if task.priority == 'high' %}selected{% endif %}>High</option>
                </select>

                <label for="due_date">Due date</label>
                <input
                    type="date"
                    id="due_date"
                    name="due_date"
                    value="{{ task.due_date.strftime('%Y-%m-%d') if task.due_date else '' }}"
                >

                <div class="form-actions">
                    <button type="submit" class="action-button complete-button">
                        Save Changes
                    </button>
                    <a href="/" class="action-button edit-button">Cancel</a>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
